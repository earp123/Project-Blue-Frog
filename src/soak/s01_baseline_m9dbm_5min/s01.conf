# Soak test s01 - baseline: both radios at -9 dBm, locked SF5 / BW500 / CR4-5,
# 5-minute continuous TDMA exchange, CSV telemetry over UART.
#
# Apply on the build line together with the role-select overlay:
#   -DEXTRA_CONF_FILE=src/soak/s01_baseline_m9dbm_5min/s01.conf
#   -DEXTRA_DTC_OVERLAY_FILE=src/soak/role_select.overlay
#
# Everything else (LoRa, logging, UART console, printk, SPI, GPIO) comes from
# the base prj.conf; COUNTER is pulled in by APP_SOAK's select in Kconfig.

CONFIG_APP_SOAK=y
CONFIG_SOAK_TEST_BASELINE=y
