# ---- Common to both units ----
# Logging over the DK's VCOM UART. The shield unit keeps it for bring-up; the
# TFT unit is display-only and turns it off in its companion conf
# (boards/nrf5340dk_nrf5340_cpuapp_tft.conf).
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_PRINTK=y
CONFIG_SPI=y
CONFIG_GPIO=y

# ---- LoRa (SX1262 on spi2 / port 1, both units) ----
# The native driver is used for init only; the TDMA layer (src/tdma) owns
# the radio after that.
CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y
CONFIG_LORA_SX126X_NATIVE=y

# Everything front-end specific (display, touch/buttons, SD + FAT, the unit
# type itself) lives in the unit's companion conf, applied with its overlay:
# boards/nrf5340dk_nrf5340_cpuapp_{tft,shield}.{conf,overlay}.
