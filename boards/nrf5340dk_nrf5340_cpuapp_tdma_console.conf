# Intercom TDMA field console — companion config for the Hiletgo TFT breakout
# overlay boards/nrf5340dk_nrf5340_cpuapp_display.overlay (shared with the
# telemetry console; the front-end wiring is identical).
#
# Apply together with the overlay:
#   -DEXTRA_DTC_OVERLAY_FILE=boards/nrf5340dk_nrf5340_cpuapp_display.overlay
#   -DEXTRA_CONF_FILE=boards/nrf5340dk_nrf5340_cpuapp_tdma_console.conf

# Select the TDMA field console application variant (see Kconfig).
CONFIG_APP_TDMA_CONSOLE=y

# Display: ILI9341 over MIPI-DBI-SPI
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
# Reuse CFB's bundled fonts as glyph data; we blit RGB565 ourselves because
# CFB's own framebuffer is monochrome-only and cannot drive the ILI9341.
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=y

# Touch: XPT2046 via the input subsystem; DK buttons via gpio-keys
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

# SD card over SPI + FAT filesystem: the soak logger (src/tdma_console/sd_log.c)
# writes run logs to the microSD on the same spi4 bus as the display/touch
# (chip select reg 2, see the display overlay).
CONFIG_DISK_ACCESS=y
CONFIG_SDHC=y
CONFIG_SDMMC_STACK=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# Accept both card formats found on the bench: FAT32 for small cards, exFAT
# for the >32 GB ones Windows will not format as FAT32. exFAT selects LFN
# automatically (FatFs requires it). LFN defaults to the BSS working-buffer
# mode, which is documented as not thread-safe — that is safe here because
# every FatFs call is made from the soak_log writer thread and nowhere else.
CONFIG_FS_FATFS_EXFAT=y

# 64-bit LBA, which also brings GPT partition-table support. Large SDXC cards
# are not always MBR-partitioned, and without this FatFs cannot find the
# volume on a GPT card at all.
CONFIG_FS_FATFS_LBA64=y

# Never reformat a card we failed to mount. Zephyr's default answer to
# FR_NO_FILESYSTEM is f_mkfs(FM_ANY | FM_SFD) — it would wipe the operator's
# card, partition table included, because the logger did not recognise it.
# sd_log.c also sets FS_MOUNT_FLAG_NO_FORMAT; this removes the code outright.
CONFIG_FS_FATFS_MOUNT_MKFS=n

CONFIG_MAIN_STACK_SIZE=8192

# Display-only build: no UART / serial / console / logging. All state is shown
# on the TFT. (prj.conf keeps logging enabled for the LoRa-send variant, which
# has no display and reports over UART; these lines override it here.)
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_BOOT_BANNER=n
