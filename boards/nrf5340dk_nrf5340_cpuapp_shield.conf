# TDMA field variant: companion config for the rev 2 shield overlay
# boards/nrf5340dk_nrf5340_cpuapp_shield.overlay (SSD1306 OLED on i2c1,
# microSD on spi4, SX1262 on spi2).
#
# Apply together with the overlay:
#   -DEXTRA_DTC_OVERLAY_FILE=boards/nrf5340dk_nrf5340_cpuapp_shield.overlay
#   -DEXTRA_CONF_FILE=boards/nrf5340dk_nrf5340_cpuapp_shield.conf

# Select the TDMA field variant (see Kconfig).
CONFIG_APP_TDMA_FIELD=y

# Display: SSD1306 128x64 over I2C, drawn through CFB's own monochrome
# framebuffer. The SSD1306 driver selects I2C; it is set here as well so the
# dependency is written down. The variant adds an 8x8 font
# (src/tdma_field/font_unscii8.c) because the smallest bundled font, 10x16,
# fits only 12 x 4 characters on the panel. The bundled fonts stay in for the
# splash screen.
CONFIG_DISPLAY=y
CONFIG_I2C=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=y

# cfb_framebuffer_init() k_malloc()s the 1 KB frame (128 x 64 / 8).
CONFIG_HEAP_MEM_POOL_SIZE=2048

# DK buttons via gpio-keys (no touch on this variant).
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

# SD card over SPI + FAT filesystem: the soak logger
# (src/tdma_console/sd_log.c, shared) writes run logs to the microSD on spi4.
# The rest of this block matches the TDMA console's config line for line.
CONFIG_DISK_ACCESS=y
CONFIG_SDHC=y
CONFIG_SDMMC_STACK=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# Accept both card formats found on the bench: FAT32 for small cards, exFAT
# for the >32 GB ones Windows will not format as FAT32. exFAT selects LFN
# automatically (FatFs requires it). LFN defaults to the BSS working-buffer
# mode, which is documented as not thread-safe. That is safe here because
# every FatFs call is made from the soak_log writer thread and nowhere else.
CONFIG_FS_FATFS_EXFAT=y

# 64-bit LBA, which also brings GPT partition-table support. Large SDXC cards
# are not always MBR-partitioned, and without this FatFs cannot find the
# volume on a GPT card at all.
CONFIG_FS_FATFS_LBA64=y

# Never reformat a card we failed to mount. Zephyr's default answer to
# FR_NO_FILESYSTEM is f_mkfs(FM_ANY | FM_SFD), which would wipe the operator's
# card, partition table included, just because the logger did not recognise
# it. sd_log.c also sets FS_MOUNT_FLAG_NO_FORMAT; this removes the code
# outright.
CONFIG_FS_FATFS_MOUNT_MKFS=n

CONFIG_MAIN_STACK_SIZE=8192

# UART logging stays ON for bring-up (prj.conf's LOG + UART backend). Unlike
# the TFT front end, this shield does not use VCOM's pins (P0.20/P0.22), so
# they are not contended. Stripping it back to display-only is a follow-on
# once the variant is proven.
