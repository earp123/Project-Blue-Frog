CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2S=y

# Shell on the DK's VCOM (uart0, 115200): the "wm" commands.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_I2S_LOG_LEVEL_WRN=y

CONFIG_MAIN_STACK_SIZE=2048

# printf of floats (stat), and the FPU for the tone and levels.
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Bring-up diagnostics: i2c scan, gpio get.
CONFIG_I2C_SHELL=y
CONFIG_GPIO_SHELL=y
